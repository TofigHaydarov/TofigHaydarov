<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelişmiş Ana Sayfa Taslağı</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4; /* Hafif gri arka plan */
            color: #333;
        }

        header {
            background-color: #333; /* Koyu navigasyon çubuğu */
            color: white;
            padding: 1em 0;
            text-align: center;
        }

        nav ul {
            list-style: none; /* Noktaları kaldır */
            padding: 0;
            margin: 0;
            display: flex; /* Menü öğelerini yan yana diz */
            justify-content: center; /* Ortala */
        }

        nav ul li {
            margin: 0 15px;
        }

        nav ul li a {
            color: white;
            text-decoration: none; /* Alt çizgiyi kaldır */
            font-weight: bold;
            transition: color 0.3s; /* Renk geçişi yumuşak olsun */
        }
        
        nav ul li a:hover {
            color: #ff9900; /* Fare üzerine gelince renk değiştir */
        }

        .hero-section {
            background: url('https://picsum.photos/1200/400') no-repeat center center/cover; /* Örnek görsel */
            color: white;
            text-align: center;
            padding: 100px 20px;
            height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .hero-section h2 {
            font-size: 2.5em;
            margin-bottom: 0.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7); /* Okunurluğu artırmak için gölge */
        }

        .content-section {
            padding: 20px;
            max-width: 1200px;
            margin: 20px auto;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Hafif kutu gölgesi */
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1em 0;
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="#">Ana Sayfa</a></li>
                <li><a href="#hakkinda">Hakkımızda</a></li>
                <li><a href="#hizmetler">Hizmetler</a></li>
                <li><a href="#iletisim">İletişim</a></li>
            </ul>
        </nav>
    </header>
